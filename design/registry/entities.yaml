# ─── FORMULAS ────────────────────────────────────────────────────────────────
formulas:
  - name: tsiolkovsky_rocket_equation
    status: active
    source: design/game-brief.md
    referenced_by:
      - design/game-brief.md
      - data/index.ts
    variables:
      - isp_s
      - g0_ms2
      - m0_wet_kg
      - mf_dry_kg
    output_range: [0.0, 50.0]
    expression: "delta_v = (isp_s * g0_ms2 * ln(m0_wet_kg / mf_dry_kg)) / 1000.0"
    notes: "Calculates achievable vacuum delta-V in km/s for a single propulsion stage."
    added: 2026-11-13
    revised: ""

  - name: vis_viva_equation
    status: active
    source: design/game-brief.md
    referenced_by:
      - design/game-brief.md
      - data/index.ts
    variables:
      - mu_km3s2
      - r_km
      - a_km
    output_range: [0.0, 50.0]
    expression: "v = sqrt(mu_km3s2 * (2.0 / r_km - 1.0 / a_km))"
    notes: "Computes orbital velocity (km/s) at distance r given parent body gravitational parameter mu and semi-major axis a."
    added: 2026-11-13
    revised: ""

